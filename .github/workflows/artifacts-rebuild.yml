name: Verify generated artifacts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
          install-quarto: false
          install-pandoc: false

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          packages: |
            any::yaml
            any::jsonlite
          dependencies: '"hard"'

      - name: Rebuild graph and tutorial inventories
        run: Rscript R/build_artifacts.R

      - name: Rebuild decision tree
        run: Rscript R/build_decision_tree.R

      - name: Verify generated artifacts match reviewed sources
        run: python3 scripts/check-artifacts.py

      - name: Retain generated artifacts for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: generated-artifacts
          path: artifacts/
          if-no-files-found: error
